version: 1
jobs:
  - name: server-test
    run: |
      sh server/scripts/scala.sh test server/project.scala server/src
      bun test server/test
  - name: server-deploy
    needs: [server-test]
    run: sh server/scripts/deploy.sh
  - name: cli-deploy
    run: sh cli/scripts/deploy.sh
  - name: pluging-deploy
    run: sh plugin/scripts/deploy.sh
